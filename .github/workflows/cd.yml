name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to RMM LXC (CT 111)
    # Läuft auf dem Self-hosted Runner IM LXC selbst — das Deploy ist damit
    # ein lokaler Skriptaufruf. Ein GitHub-hosted Runner käme an den LXC
    # nicht heran: die LAN-IP ist von außen unerreichbar und Cloudflare
    # nimmt auf proxied Hostnamen kein rohes SSH an.
    runs-on: [self-hosted, rmm]
    # Only deploy when the CI run that triggered this actually passed.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: production
    steps:
      - name: Deploy
        run: /opt/rxf-rmm/infrastructure/deploy.sh

# Setup (einmalig, im LXC CT 111): Self-hosted Runner installieren —
# GitHub → Settings → Actions → Runners → "New self-hosted runner" (Linux
# x64) zeigt die exakten Befehle inkl. Registrierungs-Token. Beim
# `config.sh` das Label `rmm` vergeben und den Runner als Dienst starten
# (`./svc.sh install <user> && ./svc.sh start`).
# Details + Nutzer/Rechte: infrastructure/DEPLOYMENT.md, Abschnitt 6.
#
# Die früheren Secrets DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY werden
# nicht mehr benötigt und können gelöscht werden.
