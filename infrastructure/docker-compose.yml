services:
  backend:
    build:
      context: ../backend
    image: rxf-sys/rmm-backend:latest
    container_name: rxf-rmm-backend
    restart: unless-stopped
    env_file:
      - ./.env
    expose:
      - "8080"
    volumes:
      # Persists the RMM SQLite file (accounts, devices, metrics, jobs, …)
      # across container restarts.
      - rxf-rmm-data:/data
      # Signed agent binaries + manifest.json for self-update. Drop the output
      # of `make sign` here (host path ./agent-releases). Read-only — the
      # backend only serves from it. See agent/install/README.md.
      - ./agent-releases:/data/agent-releases:ro
    # Hardening. The image already runs as uid 10001 (see backend/Dockerfile);
    # these three lines take away what the process does not need at runtime.
    # An existing rxf-rmm-data volume is root-owned and needs a ONE-TIME
    # chown before the first deploy of this image — see docs/OPERATIONS.md.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Liveness only: /api/health never touches the database, so a locked
      # file cannot trigger a restart loop that a restart cannot fix.
      # /api/ready is the deployment gate instead (see deploy.sh).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - rmm

  web:
    build:
      context: ../frontend
    image: rxf-sys/rmm-web:latest
    container_name: rxf-rmm-web
    restart: unless-stopped
    depends_on:
      backend:
        # Don't serve the SPA until the API answers — avoids a window of
        # 502s on /api/* right after `docker compose up`.
        condition: service_healthy
    ports:
      # cloudflared on CT 104 forwards rmm.rxf-sys.de -> http://192.168.2.211:80.
      # Caddy listens on 8080 inside the container so it can run unprivileged.
      - "80:8080"
    environment:
      # CIDR of the cloudflared host (CT 104). Only this peer may deliver
      # proxy IP headers (CF-Connecting-IP etc.); everyone else gets them
      # stripped by Caddy. Unset = trust nobody. See .env / Caddyfile.
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-127.0.0.1/32}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # The static site is useless if Caddy stops answering; without a check
      # here a wedged web container looks healthy from the outside.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - rmm

  # --- RustDesk self-hosted relay (Phase 5) --------------------------------
  # RustDesk speaks raw TCP/UDP, which cannot ride the Cloudflare tunnel — so
  # this is the one exception to "kein direkter Port nach außen". Forward on
  # the router to 192.168.2.211: TCP 21115-21117 (+21118/21119 for web
  # clients) and UDP 21116. host networking keeps the client-visible source
  # ports intact (RustDesk is picky about NAT). See infrastructure/RUSTDESK.md.
  #
  # First start generates a key pair under the volume; read the public key
  # with `docker exec rxf-rmm-hbbs cat /root/id_ed25519.pub` and set it as
  # RUSTDESK_KEY in .env so agents pin exactly this relay.
  rustdesk-hbbs:
    # Pinned: :latest silently changed the relay under a running fleet.
    image: rustdesk/rustdesk-server:1.1.16
    container_name: rxf-rmm-hbbs
    command: hbbs -r rd.rxf-sys.de:21117
    restart: unless-stopped
    volumes:
      - rxf-rmm-rustdesk:/root
    network_mode: host

  rustdesk-hbbr:
    # Pinned: :latest silently changed the relay under a running fleet.
    image: rustdesk/rustdesk-server:1.1.16
    container_name: rxf-rmm-hbbr
    command: hbbr
    restart: unless-stopped
    volumes:
      - rxf-rmm-rustdesk:/root
    network_mode: host

volumes:
  rxf-rmm-data:
  rxf-rmm-rustdesk:

networks:
  rmm:
    driver: bridge
